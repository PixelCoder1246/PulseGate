services:
  postgres:
    image: postgres:17
    container_name: pulsegate-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pulsegate_dev
      POSTGRES_DB: pulsegate

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgres/data

  redis:
    image: redis:8-alpine
    container_name: pulsegate-redis
    restart: unless-stopped

    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
